version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    groups:
      pi-host:
        patterns:
          - "@earendil-works/pi-ai"
          - "@earendil-works/pi-coding-agent"
          - "@earendil-works/pi-tui"
