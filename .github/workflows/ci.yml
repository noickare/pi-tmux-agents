name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 9 * * 1"

permissions:
  contents: read

jobs:
  validate:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y tmux
      - run: npm ci
      - run: npm run validate
      - run: npm run smoke:runner
      - run: npm run smoke:extension
      - run: npm run pack:check
      - run: npm audit --omit=dev

  pi-latest:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y tmux
      - run: npm ci
      - name: Install the latest coordinated Pi host packages
        shell: bash
        run: |
          PI_VERSION="$(npm view @earendil-works/pi-coding-agent version)"
          TYPEBOX_VERSION="$(npm view "@earendil-works/pi-coding-agent@${PI_VERSION}" dependencies.typebox)"
          npm install --save-dev --save-exact \
            "@earendil-works/pi-ai@${PI_VERSION}" \
            "@earendil-works/pi-coding-agent@${PI_VERSION}" \
            "@earendil-works/pi-tui@${PI_VERSION}" \
            "typebox@${TYPEBOX_VERSION}"
      - run: npm run validate
      - run: npm run smoke:runner
      - run: npm run smoke:extension
      - run: npm run pack:check
